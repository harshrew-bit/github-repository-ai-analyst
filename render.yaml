services:
  - type: web
    name: github-ai-analyst-backend
    env: docker
    plan: starter
    region: oregon
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    disk:
      name: chroma-disk
      mountPath: /app/data
      sizeGB: 10
    envVars:
      - key: PORT
        value: 8000
      - key: CHROMA_PERSIST_DIRECTORY
        value: /app/data/chroma
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GEMINI_API_KEY_1
        sync: false
